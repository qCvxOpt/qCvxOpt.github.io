<style>
  .publications-view-toggle {
    margin: 0 0 1.5em 0;
    font-size: 0.95em;
    color: #555;
  }
  .publications-view-toggle .pvt-label { color: #777; margin-right: 0.4em; }
  .publications-view-toggle a {
    text-decoration: none;
    border-bottom: 1px dotted #888;
  }
  .publications-view-toggle a:hover { border-bottom-style: solid; }
  .publications-view-toggle strong { color: #111; font-weight: 600; }
  .publications-view-toggle .pvt-sep { color: #ccc; margin: 0 0.5em; }
</style>
<div class="publications-view-toggle">
  <span class="pvt-label">View as:</span>
  {% if page.permalink == '/publications/' %}
    <strong>Citations + date</strong><span class="pvt-sep">·</span><a href="{{ '/publications-by-date/' | relative_url }}">Date only</a>
  {% else %}
    <a href="{{ '/publications/' | relative_url }}">Citations + date</a><span class="pvt-sep">·</span><strong>Date only</strong>
  {% endif %}
</div>
